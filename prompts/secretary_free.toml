# Secretary free-mode (local-LLM) runtime config. Persona B.
# Tighter token caps than secretary.toml: Secretary budgets ~8k tokens of
# prompt even though the model (Qwen3.5-122B-A10B abliterated) is served at
# 100k ctx — the window is shared with the chat UI and SillyTavern, and a
# 20-message transcript doesn't need more. All other values mirror
# secretary.toml so behaviour stays deterministic when only the LLM
# provider changes.

[cooldown]
t_min_seconds        = 90
n_min_messages       = 4
l_min_weighted_chars = 200

[context]
transcript_window = 20

[llm]
model               = "qwen3.5-122b-abliterated-q4km"
max_tokens_reply    = 500
max_tokens_listener = 200

[skip_sentinels]
patterns = [
    "[skip]",
    "[跳过]",
    "【skip】",
    "【跳过】",
    "（skip）",
    "（跳过）",
]
