# Secretary free-mode (local-LLM) runtime config. Persona B.
# Tighter token caps than secretary.toml to respect the local model's 8192
# total context budget (Qwen3.5-122B-A10B abliterated, served at 8k ctx).
# All other values mirror secretary.toml so behaviour stays deterministic
# when only the LLM provider changes.

[cooldown]
t_min_seconds        = 90
n_min_messages       = 4
l_min_weighted_chars = 200

[context]
transcript_window = 20

[llm]
model               = "qwen3.5-122b-abliterated-q4km-8k"
max_tokens_reply    = 500
max_tokens_listener = 200

[skip_sentinels]
patterns = [
    "[skip]",
    "[跳过]",
    "【skip】",
    "【跳过】",
    "（skip）",
    "（跳过）",
]
